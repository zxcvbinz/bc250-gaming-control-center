name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for Qt (offscreen)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Python dependencies
        run: pip install PyQt6 PyYAML pytest ruff
      - name: Lint
        run: ruff check bc250 tests
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: Byte-compile
        run: python -m compileall -q bc250
      - name: Build the FPS engine
        run: make -C layer
