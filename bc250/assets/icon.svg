<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c232c"/>
      <stop offset="1" stop-color="#0e1116"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="0.55" stop-color="#4fa3ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
  </defs>
  <!-- chip pins -->
  <g fill="#3a4654">
    <rect x="76" y="10" width="12" height="22" rx="3"/><rect x="106" y="10" width="12" height="22" rx="3"/>
    <rect x="138" y="10" width="12" height="22" rx="3"/><rect x="168" y="10" width="12" height="22" rx="3"/>
    <rect x="76" y="224" width="12" height="22" rx="3"/><rect x="106" y="224" width="12" height="22" rx="3"/>
    <rect x="138" y="224" width="12" height="22" rx="3"/><rect x="168" y="224" width="12" height="22" rx="3"/>
    <rect x="10" y="76" width="22" height="12" rx="3"/><rect x="10" y="106" width="22" height="12" rx="3"/>
    <rect x="10" y="138" width="22" height="12" rx="3"/><rect x="10" y="168" width="22" height="12" rx="3"/>
    <rect x="224" y="76" width="22" height="12" rx="3"/><rect x="224" y="106" width="22" height="12" rx="3"/>
    <rect x="224" y="138" width="22" height="12" rx="3"/><rect x="224" y="168" width="22" height="12" rx="3"/>
  </g>
  <!-- chip body -->
  <rect x="28" y="28" width="200" height="200" rx="40" fill="url(#bg)" stroke="#2c3642" stroke-width="3"/>
  <!-- gauge -->
  <circle cx="128" cy="128" r="66" fill="none" stroke="#262e38" stroke-width="14"/>
  <circle cx="128" cy="128" r="66" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round"
          stroke-dasharray="311 415" transform="rotate(-90 128 128)"/>
  <!-- frametime line -->
  <polyline points="88,138 104,138 112,120 122,150 132,112 142,140 152,130 168,130"
            fill="none" stroke="#e6edf3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
